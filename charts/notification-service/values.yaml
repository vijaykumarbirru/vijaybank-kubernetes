# SMS / email notifications and the dev inbox (Node.js)
# Environment-specific settings (image tag, resources, routes) are in values-kind.yaml.
generic-application:
  containerPort: 8087
  env:
    MONGO_URL: "mongodb://{{ .Values.middleware.mongodb }}:27017"
  secretEnv:
    RABBITMQ_USER:
      secret: rabbitmq-credentials
      key: username
    RABBITMQ_PASSWORD:
      secret: rabbitmq-credentials
      key: password
  extraEnv:
  - name: RABBITMQ_URL
    value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@{{ .Values.middleware.rabbitmq }}:5672"
  otel:
    env:
      OTEL_NODE_DISABLED_INSTRUMENTATIONS: fs,dns,net
      NODE_OPTIONS: --require @opentelemetry/auto-instrumentations-node/register --experimental-loader=@opentelemetry/instrumentation/hook.mjs
