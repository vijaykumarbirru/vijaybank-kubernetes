# Grafana alert rules (files in alerts/), loaded by the sidecar from ConfigMaps labelled grafana_alert=1.
# Files are copied as-is (Files.Get is not templated), so Grafana's own placeholders survive.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerts
  labels:
    grafana_alert: "1"
    app.kubernetes.io/part-of: vijaybank
data:
{{- range $path, $_ := .Files.Glob "alerts/*.yaml" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
