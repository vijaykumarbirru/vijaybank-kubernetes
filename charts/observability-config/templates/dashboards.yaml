# One ConfigMap per dashboard JSON (generated by scripts/build-dashboards.py). Grafana's
# sidecar loads every ConfigMap labelled grafana_dashboard=1 into the folder in grafana_folder.
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-{{ base $path | trimSuffix ".json" }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: vijaybank
  annotations:
    grafana_folder: VijayBank
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
