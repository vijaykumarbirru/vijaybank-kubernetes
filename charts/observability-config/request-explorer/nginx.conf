server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # The page reads traces from Jaeger through here: browsers can't call Jaeger directly (no CORS).
  # Read-only: only trace search and trace-by-ID are forwarded. Service ClusterIPs are stable,
  # so a fixed proxy_pass is fine (no resolver needed, unlike Docker container IPs).
  location ~ ^/jaeger/api/traces(/[0-9a-f]+)?$ {
    rewrite ^/jaeger/(.*)$ /$1 break;
    proxy_pass http://jaeger.observability.svc.cluster.local:16686;
    proxy_read_timeout 15s;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
  }
}
