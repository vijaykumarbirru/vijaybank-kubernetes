{{- if .Values.redis.enabled }}
{{- $ctx := dict "name" "redis" "root" . }}
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "mw.labels" $ctx | nindent 4 }}
spec:
  selector: {{- include "mw.selector" $ctx | nindent 4 }}
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
# Cache, sessions and rate limits only - no persistence (same as the Docker setup).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels: {{- include "mw.labels" $ctx | nindent 4 }}
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: {{- include "mw.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mw.selector" $ctx | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 20
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
{{- end }}
