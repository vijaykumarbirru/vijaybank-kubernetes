{{- if .Values.postgres.enabled }}
{{- $ctx := dict "name" "postgres" "root" . }}
{{- $pg := .Values.postgres }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels: {{- include "mw.labels" $ctx | nindent 4 }}
data:
  # Runs once, on an empty data directory. Passwords come from env vars (the Secret).
  01-databases.sh: |
    #!/bin/sh
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<SQL
    {{- range $pg.databases }}
    CREATE USER {{ . }}_svc WITH PASSWORD '${PW_{{ upper . }}}';
    CREATE DATABASE {{ . }} OWNER {{ . }}_svc;
    {{- end }}
    {{- with $pg.readOnlyUser }}
    CREATE ROLE {{ .name }} WITH LOGIN PASSWORD '${PW_READONLY}' IN ROLE pg_read_all_data;
    {{- end }}
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "mw.labels" $ctx | nindent 4 }}
spec:
  selector: {{- include "mw.selector" $ctx | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "mw.labels" $ctx | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {{- include "mw.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mw.selector" $ctx | nindent 8 }}
      annotations:
        checksum/init: {{ $pg | toJson | sha256sum }}
    spec:
      containers:
        - name: postgres
          image: {{ $pg.image }}
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $pg.secret }}, key: postgres-password } }
            {{- range $pg.databases }}
            - name: PW_{{ upper . }}
              valueFrom: { secretKeyRef: { name: {{ $pg.secret }}, key: {{ . }} } }
            {{- end }}
            {{- with $pg.readOnlyUser }}
            - name: PW_READONLY
              valueFrom: { secretKeyRef: { name: {{ $pg.secret }}, key: {{ .secretKey }} } }
            {{- end }}
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: init
          configMap: { name: postgres-init, defaultMode: 0555 }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ $pg.storage }}
{{- end }}
