{{- if and .Values.route.enabled .Values.service.enabled (not .Values.job.enabled) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
  hostnames:
    {{- toYaml (required "route.hostnames is required" .Values.route.hostnames) | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.route.path }}
      backendRefs:
        - name: {{ include "app.name" . }}
          port: {{ include "app.servicePort" . }}
{{- end }}
