# Local cluster: 1 control-plane (also the entry point on ports 80/443) + 2 workers.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vijaybank
# Lets each node look up per-registry settings (hosts.toml) written by create-cluster.sh.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
