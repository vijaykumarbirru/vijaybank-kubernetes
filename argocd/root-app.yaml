# "App of apps": the only thing applied by hand. Argo CD then creates every Application
# in argocd/apps/ and keeps them in sync with Git.
#   kubectl apply -f argocd/root-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vijaykumarbirru/vijaybank-kubernetes.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
