# Gateway API CRDs (Gateway, HTTPRoute, ...). First, because Traefik and every route need them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/vijaykumarbirru/vijaybank-kubernetes.git
    targetRevision: main
    path: platform/gateway-api
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions:
      - ServerSideApply=true      # CRDs are too big for client-side apply's annotation
