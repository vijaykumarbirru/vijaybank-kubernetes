# PostgreSQL metrics for Prometheus (runs in middleware, next to the database).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-postgres-exporter
      targetRevision: 8.2.0
      helm:
        releaseName: postgres-exporter
        valueFiles:
          - $values/platform/observability/postgres-exporter-values.yaml
    - repoURL: https://github.com/vijaykumarbirru/vijaybank-kubernetes.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: middleware
  syncPolicy:
    automated: { prune: true, selfHeal: true }
