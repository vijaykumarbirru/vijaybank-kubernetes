# Prometheus Operator + Prometheus + Grafana + kube-state-metrics + node-exporter.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.8.2
      helm:
        releaseName: kps
        valueFiles:
          - $values/platform/observability/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/vijaykumarbirru/vijaybank-kubernetes.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true      # the operator's CRDs are too big for client-side apply
