# Our monitoring objects (ServiceMonitors, probes, dashboards, alerts). After the stack,
# because it uses the Prometheus Operator's CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/vijaykumarbirru/vijaybank-kubernetes.git
    targetRevision: main
    path: charts/observability-config
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
