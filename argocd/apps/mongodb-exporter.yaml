# MongoDB metrics for Prometheus.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-mongodb-exporter
      targetRevision: 3.22.0
      helm:
        releaseName: mongodb-exporter
        valueFiles:
          - $values/platform/observability/mongodb-exporter-values.yaml
    - repoURL: https://github.com/vijaykumarbirru/vijaybank-kubernetes.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: middleware
  syncPolicy:
    automated: { prune: true, selfHeal: true }
